<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkBuddy 对话查看器</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
  :root {
    --font-sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
  }
  body { font-family: var(--font-sans); }

  .msg-content { line-height: 1.7; }
  .msg-content p { margin-bottom: 0.5em; }
  .msg-content pre {
    background: #1e1e2e; color: #cdd6f4; padding: 12px 16px; border-radius: 8px;
    overflow-x: auto; font-size: 12px; font-family: var(--font-mono); margin: 8px 0;
  }
  .msg-content code {
    background: rgba(0,0,0,0.06); padding: 2px 5px; border-radius: 4px;
    font-size: 0.9em; font-family: var(--font-mono);
  }
  .msg-content pre code { background: none; padding: 0; }

  /* 滚动条 */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d0d5dd; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #b0b5bd; }

  /* 过渡 */
  .fade-enter-active, .fade-leave-active { transition: opacity 0.2s; }
  .fade-enter-from, .fade-leave-to { opacity: 0; }
</style>
</head>
<body class="h-full bg-white text-gray-900 antialiased">
<div id="app" class="h-full flex flex-col">
  <!-- 顶部栏 -->
  <header class="h-12 flex items-center px-4 gap-3 border-b border-gray-200 bg-white flex-shrink-0 z-10">
    <!-- 侧栏折叠按钮 -->
    <button
      @click="sidebarCollapsed = !sidebarCollapsed"
      class="w-7 h-7 flex items-center justify-center rounded-md hover:bg-gray-100 transition-colors flex-shrink-0"
      :title="sidebarCollapsed ? '展开侧栏' : '折叠侧栏'"
    >
      <svg class="w-4 h-4 text-gray-500 transition-transform" :class="sidebarCollapsed ? '' : 'rotate-180'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
    <div class="flex gap-1.5">
      <span class="w-2.5 h-2.5 rounded-full bg-[#ff5f56]"></span>
      <span class="w-2.5 h-2.5 rounded-full bg-[#ffbd2e]"></span>
      <span class="w-2.5 h-2.5 rounded-full bg-[#27c93f]"></span>
    </div>
    <span class="font-semibold text-sm tracking-tight">WB 对话查看器 （C:\Users\~\.workbuddy\projects）</span>
    <span v-if="dirName" class="text-xs text-gray-400 truncate max-w-[200px]">{{ dirName }}</span>

    <!-- 右侧：定时刷新 + 自动滚动 -->
    <div v-if="activeConv" class="ml-auto flex items-center gap-2.5">
      <label class="flex items-center gap-1.5 text-xs text-gray-500 cursor-pointer select-none">
        <input type="checkbox" v-model="autoRefresh" class="w-3.5 h-3.5 rounded border-gray-300 text-green-600 focus:ring-green-500" />
        定时刷新
      </label>
      <input
        v-if="autoRefresh"
        v-model.number="refreshInterval"
        type="number" min="1" max="60"
        class="w-12 px-1 py-0.5 text-xs text-center border border-gray-200 rounded"
        title="刷新间隔（秒）"
      />
      <span v-if="autoRefresh" class="text-[10px] text-gray-400">秒</span>

      <span class="text-gray-200">|</span>

      <label class="flex items-center gap-1.5 text-xs text-gray-500 cursor-pointer select-none">
        <input type="checkbox" v-model="autoScroll" class="w-3.5 h-3.5 rounded border-gray-300 text-blue-600 focus:ring-blue-500" />
        自动滚动
      </label>
      <input
        v-model.number="scrollThreshold"
        type="number" min="20" max="500" step="10"
        class="w-12 px-1 py-0.5 text-xs text-center border border-gray-200 rounded"
        title="吸附阈值（像素，距底小于此值即吸附）"
      />
      <span class="text-[10px] text-gray-400">px</span>
      <span v-if="autoRefresh" class="text-[10px] text-green-500 animate-pulse">●</span>
    </div>
  </header>

  <!-- 主区域 -->
  <div class="flex flex-1 overflow-hidden">

    <!-- ====== 左侧栏 ====== -->
    <aside
      class="flex-shrink-0 flex flex-col bg-gray-50 border-r border-gray-200 transition-all duration-200 overflow-hidden"
      :class="sidebarCollapsed ? 'w-0 border-r-0' : 'w-[320px]'"
    >
      <!-- 文件夹选择 -->
      <div class="p-4 border-b border-gray-200 space-y-3">
        <button
          @click="pickFolder"
          class="w-full py-2.5 px-4 rounded-lg border-2 border-dashed border-indigo-300 text-indigo-600 font-medium text-sm hover:bg-indigo-50 hover:border-indigo-400 transition-colors"
        >
          <span v-if="!dirHandle">📁 选择 JSONL 文件夹</span>
          <span v-else>📁 切换文件夹</span>
        </button>

        <!-- 扫描模式切换 -->
        <div v-if="dirHandle" class="flex rounded-lg border border-gray-200 overflow-hidden text-xs">
          <button @click="setScanMode('flat')"
            class="flex-1 py-1.5 px-2 text-center transition-colors"
            :class="scanMode === 'flat' ? 'bg-indigo-100 text-indigo-700 font-medium' : 'text-gray-500 hover:bg-gray-100'">
            扁平模式
          </button>
          <button @click="setScanMode('nested')"
            class="flex-1 py-1.5 px-2 text-center transition-colors"
            :class="scanMode === 'nested' ? 'bg-indigo-100 text-indigo-700 font-medium' : 'text-gray-500 hover:bg-gray-100'">
            嵌套项目
          </button>
        </div>
        <div v-if="!dirHandle" class="text-xs text-gray-400 text-center leading-relaxed">
          选择包含 .jsonl 文件的目录<br>
          <span class="text-gray-300">扁平模式：目录下有.jsonl ｜ 嵌套模式：扫描子目录</span>
        </div>
        <!-- 搜索 -->
        <input
          v-if="dirHandle"
          v-model="searchQuery"
          type="text"
          placeholder="搜索对话..."
          class="w-full px-3 py-2 rounded-lg border border-gray-200 text-sm focus:outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-200 bg-white"
        />
      </div>

      <!-- 对话列表 -->
      <div class="flex-1 overflow-y-auto px-2 py-1">
        <!-- 空状态 -->
        <div v-if="!dirHandle" class="flex items-center justify-center h-full">
          <p class="text-sm text-gray-400">选择文件夹以加载对话</p>
        </div>
        <div v-else-if="filteredProjects.length === 0" class="flex items-center justify-center h-full">
          <p class="text-sm text-gray-400">未找到 .jsonl 文件</p>
        </div>

        <!-- 列表 -->
        <template v-for="proj in filteredProjects" :key="proj.key">
          <!-- 嵌套模式：可折叠项目分组头 -->
          <div v-if="scanMode === 'nested'" class="group">
            <div
              @click="toggleProject(proj.projectName)"
              class="px-3 py-1.5 mt-2 mb-0.5 flex items-center gap-1.5 text-[10px] text-gray-400 font-semibold uppercase tracking-wider cursor-pointer hover:text-gray-600 select-none"
            >
              <svg class="w-2.5 h-2.5 transition-transform" :class="isProjectCollapsed(proj.projectName) ? '' : 'rotate-90'" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5l8 7-8 7z"/></svg>
              📂 {{ proj.projectName }}
              <span class="text-gray-300 font-normal ml-1">({{ proj.convs.length }})</span>
            </div>
          </div>

          <!-- 对话项（嵌套模式有缩进） -->
          <div v-if="!isProjectCollapsed(proj.projectName)">
            <div
              v-for="conv in proj.convs"
              :key="conv.sessionId"
              @click="selectConversation(conv)"
              class="px-3 py-2.5 mb-1 rounded-lg cursor-pointer transition-colors border"
              :class="[activeConv && activeConv.sessionId === conv.sessionId
                ? 'bg-indigo-50 border-indigo-300'
                : 'bg-white border-gray-100 hover:border-gray-300 hover:bg-gray-50',
                scanMode === 'nested' ? 'ml-4' : '']"
            >
              <div class="text-sm font-medium text-gray-900 truncate" :title="conv.title">
                {{ conv.title }}
              </div>
              <div class="flex items-center gap-3 mt-1 text-xs text-gray-400">
                <span>{{ conv.date }}</span>
                <span>{{ conv.msgCount }} 条</span>
                <span v-if="conv.subAgentCount > 0"
                  class="inline-flex items-center px-1.5 py-0.5 rounded-full text-[10px] font-medium bg-amber-50 text-amber-700 border border-amber-200">
                  {{ conv.subAgentCount }} 子代理
                </span>
              </div>
            </div>
          </div>
        </template>
      </div>
    </aside>

    <!-- ====== 右侧对话区 ====== -->
    <section class="flex-1 flex flex-col overflow-hidden bg-white">
      <!-- 空状态 -->
      <div v-if="!activeConv" class="flex-1 flex items-center justify-center">
        <div class="text-center">
          <div class="text-4xl mb-3">💬</div>
          <p class="text-gray-400 text-sm">选择一个对话查看详情</p>
        </div>
      </div>

      <template v-else>
        <!-- 对话头部 + 面包屑 -->
        <div class="px-5 py-3 border-b border-gray-100 flex items-center gap-3 flex-shrink-0">
          <span class="font-semibold text-sm text-gray-900 truncate max-w-[400px]">
            {{ activeConv.title }}
          </span>
          <!-- 面包屑 -->
          <div v-if="agentChain.length > 0" class="flex items-center gap-1.5 text-xs">
            <span class="text-gray-300">|</span>
            <button
              v-for="(agent, idx) in agentChain"
              :key="agent.sessionId"
              @click="switchToAgent(idx)"
              class="px-2 py-0.5 rounded transition-colors"
              :class="idx === agentChain.length - 1
                ? 'bg-indigo-100 text-indigo-700 font-medium'
                : 'text-gray-500 hover:text-gray-700 hover:bg-gray-100'"
            >
              {{ agent.label }}
            </button>
          </div>
        </div>

        <!-- 消息列表（含可见性优化） -->
        <div class="flex-1 overflow-y-auto px-5 py-4 space-y-3" ref="msgContainer" @scroll="onMsgScroll">
          <template v-for="node in renderedMessages" :key="node.id">
            <div
              v-memo="[node.id, node.collapsed, msgVisible[node.id]]"
              :ref="el => observeMsg(node.id, el)"
              :style="!msgVisible[node.id] && msgHeights[node.id] ? { height: msgHeights[node.id] + 'px' } : {}"
              class="msg-wrapper overflow-hidden flex-shrink-0"
            >
              <template v-if="msgVisible[node.id]">
                <!-- 用户消息 -->
                <div v-if="node.type === 'user'" class="flex justify-end">
                  <div class="max-w-[80%] px-4 py-2.5 rounded-xl bg-indigo-50 border border-indigo-100 text-sm msg-content" v-html="renderMarkdown(node.text)"></div>
                </div>
                <!-- 助手消息 -->
                <div v-else-if="node.type === 'assistant'" class="flex justify-start">
                  <div class="max-w-[80%] px-4 py-2.5 rounded-xl bg-gray-50 border border-gray-100 text-sm msg-content" v-html="renderMarkdown(node.text)"></div>
                </div>
                <!-- 工具调用 -->
                <div v-else-if="node.type === 'tool_call'" class="rounded-lg bg-orange-50 border border-orange-200">
                  <div class="flex items-center gap-2 px-4 py-2.5 cursor-pointer hover:bg-orange-100/50 transition-colors"
                       @click="node.collapsed = !node.collapsed">
                    <span class="text-orange-600 text-xs font-semibold select-none">🔧 {{ node.fnName }}</span>
                    <span class="ml-auto text-[10px] text-gray-400 select-none">{{ node.collapsed ? '展开 ▼' : '收起 ▲' }}</span>
                  </div>
                  <div v-show="!node.collapsed" class="border-t border-orange-100">
                    <div class="px-4 py-3 bg-orange-100/30">
                      <div class="text-[10px] text-orange-500 font-medium uppercase tracking-wide mb-1.5">输入参数</div>
                      <pre class="text-xs font-mono text-gray-600 whitespace-pre-wrap break-all m-0">{{ node.fnArgs || '(无参数)' }}</pre>
                    </div>
                    <div v-if="node.result" class="h-px bg-orange-200"></div>
                    <div v-if="node.result" class="px-4 py-3 bg-white max-h-[300px] overflow-y-auto">
                      <div class="text-[10px] text-green-600 font-medium uppercase tracking-wide mb-1.5">输出结果</div>
                      <pre class="text-xs text-gray-700 whitespace-pre-wrap font-sans leading-relaxed m-0">{{ node.result }}</pre>
                    </div>
                    <div v-else class="px-4 py-2 text-xs text-gray-400 italic">等待执行结果...</div>
                  </div>
                </div>
                <!-- 子代理跳转卡片 -->
                <div
                  v-else-if="node.type === 'subagent'"
                  @click="jumpToSubAgent(node)"
                  class="px-4 py-3 rounded-lg bg-green-50 border-2 border-dashed border-green-300 cursor-pointer hover:bg-green-100 hover:border-green-400 transition-colors flex items-center gap-3 group"
                >
                  <span class="text-lg">▶</span>
                  <div class="flex-1 min-w-0">
                    <div class="text-sm font-semibold text-green-700">子代理: {{ node.agentId }}</div>
                    <div class="text-xs text-green-600 truncate">{{ node.taskPreview || '执行任务...' }}</div>
                  </div>
                  <span class="text-xs text-green-500 font-medium group-hover:translate-x-1 transition-transform whitespace-nowrap">跳转 →</span>
                </div>
                <!-- 系统提示 -->
                <div v-else-if="node.type === 'system'" class="text-center">
                  <span class="inline-block px-3 py-1 text-xs text-gray-400 bg-gray-50 rounded-full border border-gray-100">
                    {{ node.text }}
                  </span>
                </div>
              </template>
            </div>
          </template>
        </div>

        <!-- 底部子代理标签栏 -->
        <div
          v-if="agentTags.length > 1"
          class="h-12 flex-shrink-0 border-t-2 border-dashed border-green-200 bg-green-50/50 flex items-center px-4 gap-2 overflow-x-auto max-w-full"
        >
          <span class="text-xs text-gray-500 whitespace-nowrap font-medium">子代理:</span>
          <button
            v-for="tag in agentTags"
            :key="tag.sessionId"
            @click="switchToAgent(tag.sessionId)"
            class="px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-colors border"
            :class="currentSessionId === tag.sessionId
              ? 'bg-green-600 text-white border-green-600'
              : tag.loaded
                ? 'bg-white text-green-700 border-green-200 hover:bg-green-100'
                : 'bg-gray-50 text-gray-400 border-dashed border-gray-300 hover:bg-green-50 hover:text-green-600'"
          >
            {{ tag.label }}
          </button>
        </div>
      </template>
    </section>
  </div>
</div>

<script>
const { createApp, ref, reactive, computed, nextTick, watch, onUnmounted } = Vue

createApp({
  setup() {
    let counter = 0
    const dirHandle = ref(null)
    const dirName = ref('')
    const searchQuery = ref('')
    const conversations = ref([])
    const activeConv = ref(null)
    const activeConvData = ref(null)
    const agentChain = ref([])
    const currentSessionId = ref('')   // 当前查看的 sessionId，替代 index
    const mainDiscoveredSubs = ref([]) // 主对话发现的子代理，底部标签栏始终显示
    const msgContainer = ref(null)
    const sidebarCollapsed = ref(false)
    const pendingConvId = ref('')      // URL 指定的待加载对话
    const scanMode = ref('flat')       // 'flat' | 'nested' 扫描模式
    const collapsedProjects = ref(new Set()) // 嵌套模式下折叠的项目名

    // 定时刷新
    const autoRefresh = ref(true)     // 默认开启
    const refreshInterval = ref(3)     // 默认 3 秒
    const autoScroll = ref(true)       // 是否吸附滚动
    const scrollThreshold = ref(80)    // 吸附阈值（像素）
    const displayCount = ref(50)       // 每次显示的消息数
    const isLoadingMore = ref(false)   // 是否正在加载更多
    let loadMoreTimer = null
    const batchSize = 20               // 每次加载的消息数（减少以提升性能）
    let refreshTimer = null
    let scrollRaf = null
    let msgObserver = null

    // 可见性优化：IntersectionObserver
    const msgVisible = reactive({})
    const msgHeights = reactive({})
    const observerInitialized = ref(false)

    /* ========== 文件夹操作 ========== */
    async function pickFolder() {
      try {
        const handle = await window.showDirectoryPicker({ mode: 'readwrite' })
        dirHandle.value = handle
        dirName.value = handle.name
        activeConv.value = null
        activeConvData.value = null
        agentChain.value = []
        storeHandle(handle)
        await loadConversations()
      } catch (e) {
        if (e.name !== 'AbortError') {
          console.error('选择文件夹失败:', e)
          alert('需要浏览器支持 File System Access API（Chrome/Edge 86+）')
        }
      }
    }

    function setScanMode(mode) {
      scanMode.value = mode
      activeConv.value = null
      activeConvData.value = null
      agentChain.value = []
      mainDiscoveredSubs.value = []
      collapsedProjects.value = new Set()
      updateUrlQuery(activeConv.value?.sessionId || '', mode)
      loadConversations()
    }

    function toggleProject(name) {
      const s = new Set(collapsedProjects.value)
      if (s.has(name)) s.delete(name)
      else s.add(name)
      collapsedProjects.value = s
    }

    function isProjectCollapsed(name) {
      return collapsedProjects.value.has(name)
    }

    async function loadConversations() {
      if (!dirHandle.value) return
      const list = []

      if (scanMode.value === 'flat') {
        // 扁平模式：根目录下的 .jsonl
        for await (const [name, handle] of dirHandle.value.entries()) {
          if (handle.kind !== 'file' || !name.endsWith('.jsonl')) continue
          if (name.startsWith('agent-')) continue
          const file = await handle.getFile()
          const text = await file.text()
          const info = parseConvInfo(text, name, '')
          if (info) {
            info.fileHandle = handle
            info.projectName = ''
            list.push(info)
          }
        }
      } else {
        // 嵌套模式：扫描子目录，每个子目录是一个项目
        for await (const [name, handle] of dirHandle.value.entries()) {
          if (handle.kind !== 'directory' || name.startsWith('.')) continue
          for await (const [fname, fhandle] of handle.entries()) {
            if (fhandle.kind !== 'file' || !fname.endsWith('.jsonl')) continue
            if (fname.startsWith('agent-')) continue
            const file = await fhandle.getFile()
            const text = await file.text()
            const info = parseConvInfo(text, fname, name)
            if (info) {
              info.fileHandle = fhandle
              info.projectName = name
              info.projectDirHandle = handle
              list.push(info)
            }
          }
        }
      }

      list.sort((a, b) => b.timestamp - a.timestamp)
      conversations.value = list

      // 嵌套模式：默认全部折叠
      if (scanMode.value === 'nested') {
        const names = new Set()
        list.forEach(c => { if (c.projectName) names.add(c.projectName) })
        collapsedProjects.value = names
      }

      // URL query 指定的对话自动加载
      if (pendingConvId.value) {
        const target = list.find(c => c.sessionId === pendingConvId.value)
        if (target) {
          pendingConvId.value = ''
          await selectConversation(target)
        }
      }
    }

    function parseConvInfo(text, filename, projectName) {
      const lines = text.trim().split('\n')
      if (!lines.length) return null

      const first = tryParse(lines[0])
      const last = tryParse(lines[lines.length - 1])

      let title = filename.replace('.jsonl', '')
      // 从第一条消息提取标题
      if (first && first.type === 'message' && first.role === 'user') {
        const ct = extractText(first.content)
        title = ct.slice(0, 60) || title
      }

      const timestamp = first?.timestamp || 0
      const date = timestamp ? fmtTime(timestamp) : ''

      let msgCount = 0
      let subAgentCount = 0
      const seenAgents = new Set()

      lines.forEach(l => {
        const d = tryParse(l)
        if (!d) return
        if (d.type === 'message' && (d.role === 'user' || d.role === 'assistant')) msgCount++
        if (d.type === 'function_call_result' && d.name === 'Agent') {
          const sid = d.providerData?.toolResult?.subAgent?.sessionId
          if (sid && !seenAgents.has(sid)) {
            seenAgents.add(sid)
            subAgentCount++
          }
        }
      })

      const sessionId = filename.replace('.jsonl', '')
      return { title, date, msgCount, subAgentCount, timestamp, sessionId, filename }
    }

    /* ========== 选择对话 ========== */
    async function selectConversation(conv) {
      activeConv.value = conv
      agentChain.value = []
      currentSessionId.value = conv.sessionId
      mainDiscoveredSubs.value = []
      autoScroll.value = true  // 新对话默认吸附滚动
      displayCount.value = batchSize  // 重置分页
      // 重置可见性状态
      Object.keys(msgVisible).forEach(k => delete msgVisible[k])
      Object.keys(msgHeights).forEach(k => delete msgHeights[k])
      // 更新 URL query
      updateUrlQuery(conv.sessionId, scanMode.value)
      await loadAndRender(conv, false)
      // 初始化可见性观察器
      initMsgVisibility()
      // 如果定时刷新已开启，启动定时器
      if (autoRefresh.value) startAutoRefresh()
    }

    function initMsgVisibility() {
      // 先设置所有可见节点可见
      const nodes = renderedMessages.value
      nodes.forEach(n => { msgVisible[n.id] = true })
      // nextTick 后建立 IntersectionObserver
      nextTick(() => {
        setupMsgObserver()
      })
    }

    function updateUrlQuery(sessionId, mode) {
      const url = new URL(window.location)
      if (sessionId) {
        url.searchParams.set('conv', sessionId)
      } else {
        url.searchParams.delete('conv')
      }
      if (mode) {
        url.searchParams.set('mode', mode)
      }
      history.replaceState(null, '', url)
    }

    async function loadAndRender(conv, isSubAgent, isRefresh) {
      let text
      if (isSubAgent) {
        text = conv._cachedContent
      } else {
        const file = conv.fileHandle
        if (!file) return
        const f = await file.getFile()
        text = await f.text()
        conv._cachedContent = text
      }

      const rawLines = text.trim().split('\n')

      // 一次解析所有行
      const parsedLines = []
      const idMap = {}
      const childrenMap = {}  // parentId → [child objects]
      const skipTypes = new Set(['file-history-snapshot', 'reasoning'])

      for (let i = 0; i < rawLines.length; i++) {
        const d = tryParse(rawLines[i])
        if (!d || !d.id || skipTypes.has(d.type)) continue
        parsedLines.push(d)
        idMap[d.id] = d
        const pid = d.parentId || '__root__'
        if (!childrenMap[pid]) childrenMap[pid] = []
        childrenMap[pid].push(d)
      }

      // O(n) DFS
      const allNodes = []
      const visited = new Set()
      function dfs(id) {
        const d = idMap[id]
        if (!d || visited.has(id)) return
        visited.add(id)
        renderNode(d, allNodes, 0)
        const children = childrenMap[id]
        if (children) {
          children.forEach(child => dfs(child.id))
        }
      }

      // 从根节点开始
      const roots = childrenMap['__root__'] || []
      roots.forEach(d => dfs(d.id))

      // 处理可能的孤立节点
      for (const d of parsedLines) {
        if (visited.has(d.id)) continue
        dfs(d.id)
      }

      // 收集所有发现的子代理
      const discoveredSubs = []
      allNodes.forEach(n => {
        if (n.type === 'subagent') {
          discoveredSubs.push({ sessionId: n.agentId, taskPreview: n.taskPreview })
        }
      })
      activeConvData.value = { nodes: allNodes, idMap, conv, text, discoveredSubs }

      // 主对话的发现列表单独存，供底部标签栏使用
      if (!isSubAgent) {
        mainDiscoveredSubs.value = discoveredSubs
      }

      // 滚动：首次加载滚动到底部，刷新时保持位置
      nextTick(() => {
        if (isRefresh) {
          // 不滚动
        } else if (msgContainer.value) {
          // 首次加载滚动到底部（显示最新消息）
          msgContainer.value.scrollTop = msgContainer.value.scrollHeight
          autoScroll.value = true
        }
      })
    }

    function renderNode(d, nodes, depth) {
      switch (d.type) {
        case 'message': {
          if (d.role === 'user') {
            // 过滤 system-reminder，只保留 user_query
            const raw = extractText(d.content)
            const qm = raw.match(/<user_query>(.*?)<\/user_query>/s)
            const text = qm ? qm[1].trim() : raw
            if (text) nodes.push({ id: d.id, type: 'user', text, depth })
          } else if (d.role === 'assistant') {
            const text = extractText(d.content)
            if (text) nodes.push({ id: d.id, type: 'assistant', text, depth })
          }
          break
        }
        case 'function_call': {
          if (!d.name && !d.function) {
            // 可能是子代理调用 → 在 function_call_result 中处理
            break
          }
          const fnName = d.name || d.function?.name || '?'
          let fnArgs = ''
          try {
            if (d.arguments) fnArgs = JSON.stringify(JSON.parse(d.arguments), null, 2)
            else if (d.function?.arguments) fnArgs = JSON.stringify(JSON.parse(d.function.arguments), null, 2)
          } catch { fnArgs = d.arguments || '' }
          nodes.push({ id: d.id, type: 'tool_call', fnName, fnArgs, depth, collapsed: false })
          break
        }
        case 'function_call_result': {
          if (d.name === 'Agent') {
            const sa = d.providerData?.toolResult?.subAgent
            const agentId = sa?.sessionId || d.callId || '?'
            const taskPreview = extractText(d.output?.text || '').slice(0, 60)
            nodes.push({ id: d.id, type: 'subagent', agentId, taskPreview, depth })
          } else {
            // 更新上一个 tool_call 的 result（不截断）
            const last = nodes[nodes.length - 1]
            if (last && last.type === 'tool_call') {
              last.result = extractText(d.output?.text || d.content || '')
              last.collapsed = false
            }
          }
          break
        }
        case 'reasoning': {
          // 跳过推理内容
          break
        }
        case 'file-history-snapshot': {
          // 跳过
          break
        }
        default: {
          nodes.push({ id: d.id, type: 'system', text: `[${d.type}]`, depth })
        }
      }
    }

    /* ========== 子代理跳转 ========== */
    async function jumpToSubAgent(node) {
      await loadSubAgentBySessionId(node.agentId, node.taskPreview)
    }

    async function loadSubAgentBySessionId(sessionId, taskPreview) {
      if (!dirHandle.value || !activeConv.value) return

      // 如果已加载，直接切换
      const existing = agentChain.value.findIndex(a => a.sessionId === sessionId)
      if (existing >= 0) {
        currentSessionId.value = sessionId
        await loadAndRender(agentChain.value[existing], true)
        return
      }

      const convDir = activeConv.value.sessionId
      let file
      try {
        if (scanMode.value === 'nested' && activeConv.value.projectDirHandle) {
          // 嵌套模式：projectDir/sessionId/subagents/agentId.jsonl
          const dirEntry = await activeConv.value.projectDirHandle.getDirectoryHandle(convDir)
          const subDir = await dirEntry.getDirectoryHandle('subagents')
          file = await subDir.getFileHandle(`${sessionId}.jsonl`)
        } else {
          // 扁平模式：sessionId/subagents/agentId.jsonl
          const dirEntry = await dirHandle.value.getDirectoryHandle(convDir)
          const subDir = await dirEntry.getDirectoryHandle('subagents')
          file = await subDir.getFileHandle(`${sessionId}.jsonl`)
        }
      } catch {
        alert(`找不到子代理文件: ${convDir}/subagents/${sessionId}.jsonl`)
        return
      }

      const f = await file.getFile()
      const text = await f.text()

      const newAgent = {
        sessionId,
        label: `${sessionId.slice(0, 16)} — ${(taskPreview || '').slice(0, 20)}`,
        _cachedContent: text,
        fileHandle: file,
        title: taskPreview || sessionId,
      }

      agentChain.value = [...agentChain.value, newAgent]
      currentSessionId.value = sessionId
      displayCount.value = batchSize
      // 重置可见性
      Object.keys(msgVisible).forEach(k => delete msgVisible[k])
      Object.keys(msgHeights).forEach(k => delete msgHeights[k])
      await loadAndRender(newAgent, true)
      initMsgVisibility()
    }

    async function switchToAgent(sessionId) {
      if (sessionId === activeConv.value?.sessionId) {
        // 回到主对话
        currentSessionId.value = sessionId
        displayCount.value = batchSize
        Object.keys(msgVisible).forEach(k => delete msgVisible[k])
        Object.keys(msgHeights).forEach(k => delete msgHeights[k])
        await loadAndRender(activeConv.value, false)
        initMsgVisibility()
      } else {
        // 切换到子代理（可能需懒加载）
        const tag = agentTags.value.find(t => t.sessionId === sessionId)
        if (tag && !tag.loaded) {
          loadSubAgentBySessionId(sessionId, tag.discovered?.taskPreview || '')
        } else if (tag && tag.loaded) {
          currentSessionId.value = sessionId
          displayCount.value = batchSize
          Object.keys(msgVisible).forEach(k => delete msgVisible[k])
          Object.keys(msgHeights).forEach(k => delete msgHeights[k])
          const target = agentChain.value.find(a => a.sessionId === sessionId)
          if (target) {
            await loadAndRender(target, true)
            initMsgVisibility()
          }
        }
      }
    }

    /* ========== Computed ========== */
    const filteredProjects = computed(() => {
      let list = conversations.value
      if (searchQuery.value) {
        const q = searchQuery.value.toLowerCase()
        list = list.filter(c => c.title.toLowerCase().includes(q))
      }

      if (scanMode.value === 'flat') {
        // 扁平模式：所有对话在一个组
        return list.length > 0 ? [{ key: 'flat', projectName: '', convs: list }] : []
      } else {
        // 嵌套模式：按 projectName 分组
        const groups = {}
        list.forEach(c => {
          const pn = c.projectName || '(未命名)'
          if (!groups[pn]) groups[pn] = []
          groups[pn].push(c)
        })
        return Object.entries(groups).map(([name, convs]) => ({
          key: name, projectName: name, convs
        }))
      }
    })

    const renderedMessages = computed(() => {
      const nodes = activeConvData.value?.nodes || []
      if (nodes.length <= displayCount.value) return nodes
      return nodes.slice(nodes.length - displayCount.value)
    })

    const agentTags = computed(() => {
      const tags = []
      if (!activeConv.value) return tags

      // 主对话
      tags.push({ sessionId: activeConv.value.sessionId, label: '主对话', loaded: true })

      // 子代理：按 mainDiscoveredSubs 的顺序，已加载的优先取 agentChain 的 label
      const loadedMap = {}
      agentChain.value.forEach(a => { loadedMap[a.sessionId] = a })

      mainDiscoveredSubs.value.forEach(ds => {
        if (loadedMap[ds.sessionId]) {
          tags.push({ sessionId: ds.sessionId, label: loadedMap[ds.sessionId].label, loaded: true })
        } else {
          tags.push({
            sessionId: ds.sessionId,
            label: `${ds.sessionId.slice(0, 16)} — ${(ds.taskPreview || '').slice(0, 20)}`,
            loaded: false,
            discovered: ds,
          })
        }
      })

      return tags
    })

    function renderMarkdown(text) {
      if (!text) return ''
      let html = text
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        // 去掉 @image# 引用
        .replace(/@image#\d+:\S+(\.png|\.jpg|\.jpeg|\.gif|\.webp)?/gi, '<span class="text-gray-400 text-xs">[图片]</span>')
        // 去掉 @file 引用
        .replace(/@([\w./\\-]+)/g, '<code class="text-xs">@$1</code>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\n/g, '<br>')
      return html
    }

    /* ========== 定时刷新 + 吸附滚动 ========== */
    function startAutoRefresh() {
      stopAutoRefresh()
      const ms = Math.max(1, refreshInterval.value || 5) * 1000
      refreshTimer = setInterval(refreshCurrentView, ms)
    }

    function stopAutoRefresh() {
      if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null }
    }

    function onMsgScroll() {
      if (!msgContainer.value) return
      const el = msgContainer.value
      const threshold = scrollThreshold.value || 80
      autoScroll.value = (el.scrollHeight - el.scrollTop - el.clientHeight) < threshold

      // 滚动到顶部时加载更多（防抖）
      if (el.scrollTop < 180 && !isLoadingMore.value && !loadMoreTimer) {
        loadMoreTimer = setTimeout(() => {
          loadMoreTimer = null
          loadMoreMessages()
        }, 300)
      }
    }

    function loadMoreMessages() {
      const nodes = activeConvData.value?.nodes || []
      if (displayCount.value >= nodes.length) return // 已全部加载
      if (isLoadingMore.value) return
      isLoadingMore.value = true

      const el = msgContainer.value
      const oldScrollHeight = el ? el.scrollHeight : 0

      displayCount.value = Math.min(displayCount.value + batchSize, nodes.length)

      // 恢复滚动位置（新增内容在顶部）
      nextTick(() => {
        requestAnimationFrame(() => {
          if (el) {
            const newScrollHeight = el.scrollHeight
            el.scrollTop = (el.scrollTop || 0) + (newScrollHeight - oldScrollHeight)
          }
          // 新节点默认可见
          const allNodes = activeConvData.value?.nodes || []
          allNodes.forEach(n => { if (!(n.id in msgVisible)) msgVisible[n.id] = true })
          isLoadingMore.value = false
        })
      })
    }

    /* ========== 可见性优化 ========== */
    function setupMsgObserver() {
      destroyMsgObserver()
      if (!msgContainer.value) return
      msgObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const id = entry.target.dataset.msgId
          if (!id) return
          if (entry.isIntersecting) {
            // 进入可视区：显示内容
            msgVisible[id] = true
            // 延迟清除固定高度，等待 Vue 渲染
            nextTick(() => {
              requestAnimationFrame(() => {
                const el = entry.target
                if (el && msgVisible[id]) {
                  const h = el.getBoundingClientRect().height
                  if (h > 0) msgHeights[id] = h
                  el.style.height = ''
                }
              })
            })
          } else {
            // 离开可视区：记录高度，隐藏内容
            const h = entry.target.getBoundingClientRect().height
            if (h > 0) msgHeights[id] = h
            msgVisible[id] = false
            entry.target.style.height = (msgHeights[id] || 80) + 'px'
          }
        })
      }, {
        root: msgContainer.value,
        rootMargin: '400px 0px 400px 0px',
      })
      observerInitialized.value = true
    }

    function destroyMsgObserver() {
      if (msgObserver) { msgObserver.disconnect(); msgObserver = null }
      observerInitialized.value = false
    }

    function observeMsg(id, el) {
      if (!el || !msgObserver) return
      if (el.dataset.msgObserved) return
      el.dataset.msgId = id
      el.dataset.msgObserved = '1'
      msgObserver.observe(el)
    }

    function scrollToBottom(force) {
      if (!msgContainer.value) return
      if (!autoScroll.value && !force) return
      cancelAnimationFrame(scrollRaf)
      scrollRaf = requestAnimationFrame(() => {
        if (msgContainer.value) {
          msgContainer.value.scrollTop = msgContainer.value.scrollHeight
        }
      })
    }

    /* ========== 定时刷新 + 吸附滚动 ========== */

    function snapshotCollapsed(nodes) {
      const map = {}
      nodes.forEach(n => { if (n.type === 'tool_call') map[n.id] = n.collapsed })
      return map
    }

    function restoreCollapsed(nodes, map) {
      nodes.forEach(n => {
        if (n.type === 'tool_call' && map[n.id] !== undefined) n.collapsed = map[n.id]
      })
    }

    async function refreshCurrentView() {
      if (!activeConv.value) return

      // 保存当前 collapsed 状态
      const collapsedMap = snapshotCollapsed(activeConvData.value?.nodes || [])

      if (currentSessionId.value === activeConv.value.sessionId) {
        await loadAndRender(activeConv.value, false, true)
      } else {
        const agent = agentChain.value.find(a => a.sessionId === currentSessionId.value)
        if (agent) await loadAndRender(agent, true, true)
      }

      // 新节点默认可见
      const nodes = activeConvData.value?.nodes || []
      nodes.forEach(n => { if (!(n.id in msgVisible)) msgVisible[n.id] = true })

      // 恢复 collapsed + 自动滚动
      await nextTick()
      restoreCollapsed(activeConvData.value?.nodes || [], collapsedMap)
      // 延迟再滚动，确保可见性 culling 的 DOM 更新完毕
      setTimeout(() => scrollToBottom(), 300)
    }

    // 监听定时开关变化
    watch(autoRefresh, (val) => {
      if (val) startAutoRefresh()
      else stopAutoRefresh()
    })

    watch(refreshInterval, (val) => {
      if (autoRefresh.value) startAutoRefresh()
    })

    /* ========== 工具函数 ========== */
    function tryParse(line) {
      try { return JSON.parse(line) } catch { return null }
    }

    function extractText(content) {
      if (typeof content === 'string') return content
      if (Array.isArray(content)) {
        return content
          .filter(b => b && typeof b === 'object')
          .map(b => b.text || b.input_text || b.output_text || '')
          .join('\n')
      }
      if (content && typeof content === 'object' && content.text) return content.text
      return ''
    }

    function fmtTime(ts) {
      if (!ts) return ''
      const d = new Date(ts)
      return d.toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric' }) +
        ' ' + d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
    }

    /* ========== 持久化 ========== */
    async function restoreHandle() {
      try {
        const db = await openDB()
        const stored = await getStoredHandle(db)
        if (stored) {
          const perm = await stored.queryPermission({ mode: 'readwrite' })
          if (perm === 'granted') {
            dirHandle.value = stored
            dirName.value = stored.name
            await loadConversations()
          }
        }
      } catch { /* 静默失败 */ }
    }

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('wb-conv-viewer', 1)
        req.onupgradeneeded = () => req.result.createObjectStore('handles')
        req.onsuccess = () => resolve(req.result)
        req.onerror = () => reject(req.error)
      })
    }

    function storeHandle(handle) {
      openDB().then(db => {
        const tx = db.transaction('handles', 'readwrite')
        tx.objectStore('handles').put(handle, 'lastDir')
      }).catch(() => {})
    }

    function getStoredHandle(db) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction('handles', 'readonly')
        const req = tx.objectStore('handles').get('lastDir')
        req.onsuccess = () => resolve(req.result)
        req.onerror = () => reject(req.error)
      })
    }

    // 初始化
    // 读取 URL query
    const urlParams = new URLSearchParams(window.location.search)
    pendingConvId.value = urlParams.get('conv') || ''
    const urlMode = urlParams.get('mode')
    if (urlMode === 'nested' || urlMode === 'flat') {
      scanMode.value = urlMode
    }
    restoreHandle()

    // 组件卸载时清理定时器
    onUnmounted(() => {
      stopAutoRefresh()
      cancelAnimationFrame(scrollRaf)
      clearTimeout(loadMoreTimer)
      destroyMsgObserver()
    })

    return {
      dirHandle, dirName, searchQuery, conversations, activeConv,
      activeConvData, agentChain, currentSessionId, msgContainer,
      filteredProjects, renderedMessages, agentTags,
      scanMode, sidebarCollapsed, autoRefresh, refreshInterval, autoScroll, scrollThreshold, displayCount,
      pickFolder, setScanMode, toggleProject, isProjectCollapsed,
      selectConversation, jumpToSubAgent, switchToAgent,
      renderMarkdown, onMsgScroll, observeMsg, msgVisible, msgHeights,
    }
  }
}).mount('#app')
</script>
</body>
</html>
